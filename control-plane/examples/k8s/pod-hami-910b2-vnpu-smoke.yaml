# HAMi 硬件虚拟化：申请 910B2 切片（与 kube-system/hami-scheduler-device 中 vir06_1c_16g 对齐）
# 文档: https://github.com/Project-HAMi/HAMi/blob/master/docs/ascend910b-support.md
# 需集群已安装 hami-ascend-device-plugin；调度器为 volcano 或 hami-scheduler 之一（本集群训练 Job 已用 volcano + HAMi 注解）
apiVersion: v1
kind: Pod
metadata:
  name: hami-910b2-vnpu-smoke
  namespace: default
  labels:
    app: hami-910b2-vnpu-smoke
spec:
  schedulerName: volcano
  restartPolicy: Never
  containers:
    - name: vnpu-test
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/ascend-pytorch:24.0.RC1-A2-1.11.0-ubuntu20.04
      command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== HAMi vNPU smoke (910B2 slice) ==="
          npu-smi info || true
          python3 -c "import torch; import torch_npu; print('NPU:', torch_npu.npu.is_available(), 'count:', torch_npu.npu.device_count())" || true
          echo "sleep 120s for observation"
          sleep 120
      resources:
        limits:
          huawei.com/Ascend910B2: "1"
          huawei.com/Ascend910B2-memory: "16384"
        requests:
          huawei.com/Ascend910B2: "1"
          huawei.com/Ascend910B2-memory: "16384"
      volumeMounts:
        - name: ascend-driver
          mountPath: /usr/local/Ascend/driver
          readOnly: true
  volumes:
    - name: ascend-driver
      hostPath:
        path: /usr/local/Ascend/driver
        type: DirectoryOrCreate
