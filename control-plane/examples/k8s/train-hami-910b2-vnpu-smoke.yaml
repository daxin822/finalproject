# Volcano 训练 Job + HAMi 910B2 切片（vir06_1c_16g）
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: hami-train-vnpu-smoke
  namespace: default
spec:
  schedulerName: volcano
  minAvailable: 1
  tasks:
    - name: trainer
      replicas: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trainer
              image: swr.cn-south-1.myhuaweicloud.com/ascendhub/ascend-pytorch:24.0.RC1-A2-1.11.0-ubuntu20.04
              command:
                - /bin/bash
                - -c
                - |
                  echo "=== HAMi training slice ==="
                  npu-smi info || true
                  sleep 90
              resources:
                limits:
                  huawei.com/Ascend910B2: "1"
                  huawei.com/Ascend910B2-memory: "16384"
                requests:
                  huawei.com/Ascend910B2: "1"
                  huawei.com/Ascend910B2-memory: "16384"
              volumeMounts:
                - name: driver
                  mountPath: /usr/local/Ascend/driver
                  readOnly: true
          volumes:
            - name: driver
              hostPath:
                path: /usr/local/Ascend/driver
                type: DirectoryOrCreate
